name: Release

# Publishing a GitHub Release starts this: write the notes, publish, and the
# binaries and the crates.io release follow. The release exists before its
# assets do — expect a few minutes with the notes up and nothing attached.
#
# The tag is the only record of the version. `version` in Cargo.toml is a
# placeholder that each job stamps from the tag before it builds.
on:
  release:
    types: [published]

permissions:
  contents: read

# The tag reaches every step through the environment rather than being
# interpolated into a script, so its text can never be read as shell.
env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 links against an older glibc, so the binary runs on more
          # distributions.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    # Release builds use rustup, not Nix, so a binary never refers into
    # /nix/store, and they start without caches, so nothing a pull request
    # wrote can reach a published binary.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Stamp the version
        shell: bash
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $TAG is not v<semver>" >&2
            exit 1
          fi
          VERSION="$version" perl -pi -e 's/"0\.0\.0"/"$ENV{VERSION}"/g' Cargo.toml
      - run: cargo build --release --target ${{ matrix.target }} -p {{project}}
      - name: Archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          name="{{project}}-${TAG}-${TARGET}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "dist/${name}.zip" "./target/${TARGET}/release/{{project}}.exe" LICENSE README.md
          else
            tar -czf "dist/${name}.tar.gz" -C "target/${TARGET}/release" {{project}} -C "$GITHUB_WORKSPACE" LICENSE README.md
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # One job owns the upload so the matrix builds cannot race, and so the
  # checksums are computed from exactly the bytes that get attached.
  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          for f in {{project}}-*; do
            sha256sum "$f" > "$f.sha256"
          done
      # `gh release upload` only adds assets, so the notes written by hand are
      # never touched. --clobber keeps a re-run from failing on an asset that
      # is already there.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber

  # Trusted publishing: crates.io trusts this workflow through OIDC, so no
  # token is stored. Register the workflow on crates.io before the first
  # release.
  crates-io:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Stamp the version
        run: VERSION="${TAG#v}" perl -pi -e 's/"0\.0\.0"/"$ENV{VERSION}"/g' Cargo.toml
      # A re-run after a successful publish must not fail on the version
      # crates.io already has.
      - name: Check whether this version is published
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "{{project}} release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/{{project}}/${TAG#v}")
          echo "skip=$([[ "$status" == 200 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        if: steps.published.outputs.skip != 'true'
        id: auth
      - if: steps.published.outputs.skip != 'true'
        run: cargo publish --workspace --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
